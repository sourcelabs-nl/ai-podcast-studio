# Self-hosted Nitter, used to read the X/Twitter sources this podcast polls.
#
# nitter.net was decommissioned upstream in August 2026 and now answers 403, which silently killed
# 35 of this app's sources. A personal-scale instance is the remaining way to read those accounts
# without the paid X API.
#
# Requires a sessions.jsonl next to this file — see README.md. Nitter will not start without it.
#
#   docker compose -f docker/nitter/docker-compose.yml up -d
#
services:
  nitter:
    # latest-arm64 for Apple Silicon; use zedeus/nitter:latest on x86_64.
    image: zedeus/nitter:latest-arm64
    container_name: nitter
    ports:
      # 8081 rather than 8080: the app itself runs on 8085 and the frontend on 3005, but 8080 is
      # a common collision on a dev machine.
      - "127.0.0.1:8081:8080"
    volumes:
      - ./nitter.conf:/src/nitter.conf:ro,Z
      - ./sessions.jsonl:/src/sessions.jsonl:ro,Z
    depends_on:
      - nitter-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-nv", "--tries=1", "--spider", "http://127.0.0.1:8080/Jack/status/20"]
      interval: 30s
      timeout: 5s
      retries: 2
    user: "998:998"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  nitter-redis:
    image: redis:6-alpine
    container_name: nitter-redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - nitter-redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 2
    user: "999:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  nitter-redis:
