[Server]
# Bound to localhost only by the compose port mapping; this is a personal-scale instance.
hostname = "localhost:8081"
title = "nitter"
address = "0.0.0.0"
port = 8080
https = false
httpMaxConnections = 100
staticDir = "./public"

[Cache]
listMinutes = 240
# The app polls each source every 30 minutes, so a 10-minute RSS cache costs nothing and
# absorbs any accidental double-poll.
rssMinutes = 10
redisHost = "nitter-redis"
redisPort = 6379
redisPassword = ""
redisConnections = 20
redisMaxConnections = 30

[Config]
# CHANGE THIS before first run: openssl rand -hex 32
hmacKey = "83a66ac26f05a9383dcd237e44d127092910db7da4987c6a7ac5747f354c52b3"
base64Media = false
enableRSS = true
enableRSSUserTweets = true
enableRSSUserReplies = false
enableRSSUserMedia = false
enableRSSSearch = false
enableRSSList = false
enableDebug = false
proxy = ""
proxyAuth = ""
apiProxy = ""
# Enable this if cookie-based auth starts failing.
disableTid = false
# Kept low deliberately: one burner session is easy to rate limit, and 35 feeds polled every
# 30 minutes is a trickle. Raise only if you add more sessions to sessions.jsonl.
maxConcurrentReqs = 2
maxRetries = 1
retryDelayMs = 150

[Preferences]
theme = "Nitter"
replaceTwitter = ""
replaceYouTube = ""
replaceReddit = ""
# The app only reads RSS text, never media, so proxying video is wasted work.
proxyVideos = false
hlsPlayback = false
infiniteScroll = false
