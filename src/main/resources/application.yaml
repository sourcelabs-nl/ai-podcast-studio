spring:
  application:
    name: ai-podcast-studio
  jackson:
    json:
      read:
        allow-backslash-escaping-any-character: true
  lifecycle:
    timeout-per-shutdown-phase: 10s
  # Baseline timeouts for auto-configured RestClient.Builder / RestTemplateBuilder clients
  # (Tavily, SoundCloud, X OAuth, research test). These are quick API calls — 30s read is a
  # generous backstop against an indefinite hang. Clients that build their own request factory
  # (LLM ChatClientFactory, Inworld TTS) are unaffected; ElevenLabs overrides read to 5m for
  # long audio synthesis.
  http:
    client:
      connect-timeout: 10s
      read-timeout: 30s
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration
  datasource:
    # SQLite permits only one writer at a time; WAL keeps reads non-blocking. busy_timeout makes a
    # connection that hits a write lock wait-and-retry (up to 30s) instead of failing with
    # SQLITE_BUSY. A single-connection pool is NOT used: the coroutine-based generation pipeline
    # needs several connections concurrently and would otherwise starve (HikariPool timeout).
    url: jdbc:sqlite:./data/ai-summary-podcast.db?busy_timeout=30000&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      connection-init-sql: "PRAGMA foreign_keys = ON"
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

app:
  encryption:
    master-key: ${APP_ENCRYPTION_MASTER_KEY}
  models:
    openrouter:
      # Closed-weight vendor models (openai/, anthropic/) are served only by their vendor or a cloud
      # reselling the vendor's deployment, and all of those endpoints report quantization "unknown".
      # OpenRouterRouting therefore sends no quantization floor for them (see CLOSED_WEIGHT_PREFIXES);
      # with the floor every request came back 404 "No endpoints found".
      # Verified against /api/v1/models/openai/gpt-6-luna/endpoints on 2026-09-23: seven endpoints,
      # OpenAI flex $0.05/$0.25, OpenAI and Azure $0.10/$0.50, Azure us/eu and Bedrock $0.11/$0.55,
      # OpenAI fast $0.20/$1.00. A live probe with require_parameters routed to OpenAI's standard
      # endpoint and was billed at $0.10/$0.50, which is the price below. It honours the reasoning
      # block: effort "none" returned 0 reasoning tokens, "medium" 19 on a one-line JSON task.
      "[openai/gpt-6-luna]":
        type: llm
        input-cost-per-mtok: 0.10
        output-cost-per-mtok: 0.50
      # selectable: false on the entries below: none has been probed through the current routing, so
      # the settings picker does not offer them. The pricing stays so episodes generated on them
      # still resolve a cost.
      "[openai/gpt-5.4-nano]":
        type: llm
        input-cost-per-mtok: 0.20
        output-cost-per-mtok: 1.25
        selectable: false
      "[anthropic/claude-sonnet-4.6]":
        type: llm
        input-cost-per-mtok: 3.00
        output-cost-per-mtok: 15.00
        selectable: false
      "[anthropic/claude-opus-4.7]":
        type: llm
        input-cost-per-mtok: 5.00
        output-cost-per-mtok: 25.00
        selectable: false
      "[anthropic/claude-opus-4.8]":
        type: llm
        input-cost-per-mtok: 5.00
        output-cost-per-mtok: 25.00
        selectable: false
      "[anthropic/claude-sonnet-5]":
        type: llm
        input-cost-per-mtok: 2.00
        output-cost-per-mtok: 10.00
        selectable: false
      "[anthropic/claude-opus-5]":
        type: llm
        input-cost-per-mtok: 5.00
        output-cost-per-mtok: 25.00
        selectable: false
      # Prices below are the cheapest endpoint that clears the quantization floor, since that is what
      # routing can actually select. Verified against OpenRouter's /api/v1/models and
      # /api/v1/models/{id}/endpoints on 2026-09-07.
      # The July release, and the filter/dedup default: 14 of 29 endpoints eligible, cheapest
      # OpenInference. Better and cheaper than the April release on every axis — Artificial Analysis
      # intelligence 40.8 / coding 69.1 / agentic 41.9 against no index / 56.2 / 23.8, and $0.05
      # against $0.0886 in. Its 1.31M context also exceeds the April model's 1.05M.
      "[deepseek/deepseek-v4-flash-0731]":
        type: llm
        input-cost-per-mtok: 0.05
        output-cost-per-mtok: 0.16
      # The April release (canonical slug deepseek-v4-flash-20260423), superseded as the default but
      # kept so episodes generated on it still resolve a cost. 10 of 15 endpoints eligible.
      "[deepseek/deepseek-v4-flash]":
        type: llm
        input-cost-per-mtok: 0.0886
        output-cost-per-mtok: 0.1772
      # OpenRouter alias (note the leading "~") that always routes to the newest V4 Flash release.
      # Its cheapest eligible endpoint prices identically to deepseek-v4-flash-0731, which is what it
      # currently resolves to, but the target moves without notice — so cost tracking for this entry
      # is approximate by design, and a new target can bring different reasoning defaults with it.
      "[~deepseek/deepseek-v4-flash-latest]":
        type: llm
        input-cost-per-mtok: 0.05
        output-cost-per-mtok: 0.16
      # 9 of 16 endpoints eligible, cheapest StreamLake.
      "[deepseek/deepseek-v4-pro]":
        type: llm
        input-cost-per-mtok: 0.9553
        output-cost-per-mtok: 1.9105
      # 17 of 33 endpoints eligible, cheapest StreamLake.
      "[z-ai/glm-5.2]":
        type: llm
        input-cost-per-mtok: 0.42
        output-cost-per-mtok: 1.32
      # 12 of 28 endpoints eligible (7 fp4 and 9 unknown are excluded by the floor), cheapest
      # GMICloud. Only a fallback — OpenRouter reports the real cost per call and the pipeline uses
      # that wherever it is present.
      "[z-ai/glm-5.3]":
        type: llm
        input-cost-per-mtok: 1.12
        output-cost-per-mtok: 3.52
      # 5 of 8 endpoints eligible; a live probe with the floor and the account's provider guardrails
      # applied routed to Novita, whose price this is. DeepSeek's own endpoint is cheaper overall at
      # $0.15/$0.60 but reports quantization "unknown", so the floor rejects it, as it does Fireworks
      # (unknown) and Morph (fp4). Only a fallback, like the entries above: OpenRouter reports the
      # real cost per call and the pipeline uses that wherever it is present.
      "[deepseek/deepseek-v4.1-flash]":
        type: llm
        input-cost-per-mtok: 0.30
        output-cost-per-mtok: 1.20
    openai:
      "[tts-1-hd]":
        type: tts
        cost-per-million-chars: 15.00
    elevenlabs:
      "[default]":
        type: tts
        cost-per-million-chars: 30.00
    inworld:
      "[inworld-tts-1.5-max]":
        type: tts
        cost-per-million-chars: 10.00
      "[inworld-tts-1.5-mini]":
        type: tts
        cost-per-million-chars: 5.00
      "[inworld-tts-2]":
        type: tts
        cost-per-million-chars: 25.00
  llm:
    # Every open-weight default must clear the OpenRouterRouting quantization floor, which accepts
    # only fp8 and wider. A closed-weight vendor model (openai/, anthropic/) is routed without the
    # floor, since only its vendor serves it.
    defaults:
      # Every stage runs DeepSeek v4.1 Flash. It is dearer per token than v4-flash-0731 ($0.30/$1.20
      # against $0.05/$0.16), which on real episode traffic works out at roughly a cent more per
      # episode across scoring, dedup and recap, largely paid back by compose leaving GLM-5.3.
      filter:
        provider: openrouter
        model: deepseek/deepseek-v4.1-flash
      # Dedup clusters today's candidates against recent (title-only, capped) historical articles
      # and emits structured JSON. Reasoning tokens are charged against the output cap, and a model
      # left to its own default reasoning consumed that entire budget and returned empty content,
      # failing episode 200 five times over. Both this stage and scoring therefore state an explicit
      # effort of "none"; v4.1 Flash honours it, measured at 0 reasoning tokens.
      dedup:
        provider: openrouter
        model: deepseek/deepseek-v4.1-flash
      # DeepSeek v4.1 Flash writes better prose here than GLM-5.3, which held this stage before it.
      # It is also cheaper through the routing floor ($0.30/$1.20 against $1.12/$3.52) and carries a
      # 1M context on four of its five eligible endpoints, so a large article set with tool calls has
      # room. Compose is judged on prose, not on the reasoning and coding indices that ranked
      # GLM-5.3 highest. Probed live at the stage's own medium effort: it honours the reasoning block
      # (58 reasoning tokens, not a runaway default) and returns a proper finish_reason.
      compose:
        provider: openrouter
        model: deepseek/deepseek-v4.1-flash
      # The judge only locates turns in a script it is handed, so it needs recall and no prose. It
      # runs once per script over an archive of 166, which is why it stays on the cheapest model
      # every other structured stage already uses rather than the model that wrote the script.
      eval:
        provider: openrouter
        model: deepseek/deepseek-v4.1-flash
    max-cost-cents: 200
    # Request timeout per stage. One blanket value cannot serve them all: scoring returns in seconds
    # and dedup in 21s-1m44s, while a single compose request runs 1-4 minutes. Compose once needed
    # 20 minutes because the model issued its own web_search tool calls mid-request; research now
    # runs before compose, so 5 minutes covers a compose request. A single compose-sized ceiling let
    # one hung scoring call stall a whole generation for 13 minutes; a scoring-sized one would fail
    # a real compose run. Recap resolves the filter model and so takes the filter timeout.
    #
    # Each is a hard wall-clock deadline (okhttp callTimeout), not an idle timeout, so arriving bytes
    # do not extend it and streaming a response would not either.
    timeouts:
      filter: 3m
      dedup: 5m
      compose: 5m
      eval: 5m
    # Per-request latency is recorded for every LLM call and read back as percentiles per stage,
    # which is what the timeouts above are sized against. Kept for a window: the rows answer what
    # latency is now, and nothing is billed from them.
    call-log:
      retention: 30d
    scoring:
      concurrency: 10
    dedup:
      # Cap on historical articles (most recent first) embedded in the dedup prompt for topic recall.
      max-historical-articles: 120
      # The Jev already-covered gate ahead of the clustering call. Jev answers closed questions with
      # constrained output, so it cannot return the prose, unparseable payloads or truncated arrays
      # that have cost this stage four episodes. It takes the one decision in the stage that is
      # closed (is this candidate about a topic we already covered) and leaves clustering, selection
      # and previousContext to the generative call.
      #
      # Measured over 60 candidates, 20 of them drawn from the previous episode and so provably
      # covered, against 148 covered topics: 857ms and $0.00074 for the gate against 22.9s and
      # $0.00354 for the clustering call, catching 20/20 planted and flagging the same 4 of 40 fresh
      # candidates the clustering call flags. Asking per candidate instead of batching costs
      # $0.00605, nearly twice the call it relieves, because each request re-sends the covered
      # topics. See knowledge/references/jev-decisions-endpoint.md for every figure.
      #
      # The endpoint is alpha, single-provider, with no OpenRouter routing fallback behind it, so a
      # provider outage has nothing to route to: one OpenRouter incident produced both "503 no
      # healthy upstream" and "529 system_overloaded" here. A gate that answers nothing leaves every
      # candidate in place, so an outage costs only its latency.
      gate:
        enabled: true
        # Jev is absent from /api/v1/models and is not served by /api/v1/chat/completions. The URL is
        # configured rather than derived from the stored OpenRouter base URL, which points at the
        # chat API and is user-editable.
        url: https://openrouter.ai/api/alpha/decisions
        model: typesafe/jev-1.13
        threshold: 0.8
        summary-max-chars: 300
        max-request-chars: 150000
        timeout: 30s
  briefing:
    target-words: 1500
  episode:
    recap-lookback-episodes: 7
    # Upper bound on how far an article window reaches back, however long the podcast was idle.
    max-window-days: 7
    # How long generation waits for the pollers to cover the window before composing anyway.
    poll-coverage-deadline-minutes: 30
  research:
    cost-buffer-cents: 5
    tavily:
      cost-per-call-cents: 1
  publishing:
    # Floor below which an episode is not auto-published: an episode built from almost no articles
    # is the symptom of an upstream fault, not a quiet day. It stays GENERATED for manual review.
    # A manual publish is never blocked by this floor.
    min-articles: 5

  compose:
    rapid-fire-budget-fraction: 0.15
    rapid-fire-max-items: 6
    # Cap on articles fed into a single compose request (highest-relevance kept, rest dropped).
    max-articles: 40
    # Reasoning effort for composition, overridable per podcast via composeSettings.reasoningEffort.
    # Left unset, OpenRouter infers it from the routed provider's defaults, which produced compose
    # output between 6,048 and 72,821 tokens for scripts of comparable length — 1 to 18 minutes and
    # 4 to 38 cents. Reasoning belongs to this stage, which plans a long script; the structured
    # stages ask for none. This is the pipeline's largest cost lever: turn it down to low. Note that
    # "none" is not universally accepted — glm-5.3 rejects it with "Reasoning is mandatory for this
    # endpoint and cannot be disabled" (HTTP 400), so check the model before setting it.
    reasoning-effort: medium
    # Ceiling on compose output tokens. Without one the provider reserves the model's whole output
    # window when checking affordability (a 402 asking for credit on 131,072 tokens to write a
    # 1,876-word script). Observed compose output: 2,540 min / 12,032 avg / 57,546 max, the model
    # being reasoning-heavy. Kept far above that max, since a tight ceiling truncates a script.
    max-output-tokens: 96000
  episodes:
    directory: ./data
    retention-days: 365
  # Audio generated from a script preview. It belongs to no episode, so it is kept outside the
  # episode store and swept once it is older than retention-minutes.
  preview-audio:
    directory: ./data/preview-audio
    retention-minutes: 120
    sweep-cron: "0 */15 * * * *"
  backup:
    enabled: true
    cron: "0 0 2 * * *"
    directory: ./data/backups
    retention-count: 7
  source:
    max-article-age-days: 90
    # If the last poll round is older than this (or none yet), generation runs a catch-up poll first.
    stale-round-threshold-minutes: 10
    # Host-level circuit breaker settings live under resilience4j.circuitbreaker below.
  feed:
    base-url: http://localhost:8085
    title: AI Summary Podcast
    description: AI-generated audio briefings from your favourite content sources
    owner-name: Sourcelabs
    owner-email: podcast@sourcelabs.nl
    author: Sourcelabs
    itunes-category: Technology
    explicit: false
  eval:
    judge:
      # OFF, ADVISE or ENFORCE. See JudgeMode. ENFORCE needs a norm and behaves as ADVISE without
      # one, so turning it on before the baseline exists changes nothing except the log line.
      # ADVISE by default: one cheap call per generated episode, and it is the mode that builds the
      # baseline the norm has to come from.
      mode: ADVISE
      # The overall score below which a script counts as poor, in [0, 1]. Deliberately unset: it is
      # a fact about the distribution of judged scores over the archive, and that does not exist
      # yet. Leave it unset until it has been read off a baseline.
      # norm:
  experiments:
    # The largest variants x repeats one experiment request may ask for; a larger request is refused
    # before any run starts. Six covers two variants x three repeats (or three x two). Each run is a
    # full compose plus recap and judge at real cost, and an experiment's runs execute one after
    # another, so six compose runs take roughly 10 to 30 minutes.
    max-variant-repeats: 6
  soundcloud:
    client-id: ${APP_SOUNDCLOUD_CLIENT_ID:}
    client-secret: ${APP_SOUNDCLOUD_CLIENT_SECRET:}

resilience4j:
  circuitbreaker:
    configs:
      # One breaker per source host, shared by all that host's sources. Because they share it, the
      # window fills inside a single poll round rather than over days. Only permanent failures
      # (403/404/410/401/DNS) count as failures; transient ones are ignored entirely, since
      # per-source exponential backoff already handles a merely-slow host.
      source-host:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 3
        minimum-number-of-calls: 3
        failure-rate-threshold: 100
        # A dead host is retried once a day, matching the per-source backoff ceiling.
        wait-duration-in-open-state: 24h
        # The single half-open call is the canary that probes for recovery.
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.aisummarypodcast.source.PollFailureException$Permanent
        # Ignored, not merely unrecorded: an unrecorded exception counts as a success and could
        # close the breaker on a host that never actually answered.
        ignore-exceptions:
          - com.aisummarypodcast.source.PollFailureException$Transient
        register-health-indicator: true
  retry:
    configs:
      # Retries around external LLM/TTS APIs: transient upstream faults and malformed responses.
      external-api:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        enable-exponential-backoff: true
    instances:
      article-scoring:
        base-config: external-api
      topic-dedup:
        base-config: external-api
      script-judge:
        base-config: external-api
      # Compose is the pipeline's most expensive call, so only a genuinely transient provider fault
      # is retried: a completion the client cannot read (a missing finish_reason) or an I/O failure.
      # A speaker-tag failure is deliberately absent — RoleTagValidationAdvisor already re-issues
      # the request inside the call, and retrying here would multiply attempts and cost.
      compose:
        base-config: external-api
        max-attempts: 2
        retry-exceptions:
          - com.openai.errors.OpenAIInvalidDataException
          - org.springframework.web.client.ResourceAccessException
      # Only genuinely transient Inworld faults are retried: a rate limit, an I/O failure
      # (connection reset, timeout) or an upstream 5xx. A rejected request fails immediately.
      inworld-tts:
        base-config: external-api
        retry-exceptions:
          - com.aisummarypodcast.tts.InworldRateLimitException
          - com.aisummarypodcast.tts.InworldTransientException
          - org.springframework.web.client.ResourceAccessException
      # The already-covered gate. Retried harder than its optional status suggests, because the
      # decisions endpoint is alpha with one provider and no OpenRouter routing fallback: in one
      # morning it answered three consecutive requests with "503 no healthy upstream" and both
      # chunks of a live run with "529 system_overloaded", while serving healthy requests in under
      # a second either side. A retry is the only fallback it has.
      #
      # The wait is shorter than external-api's 1s because the gate must not hold up the stage it
      # serves: three attempts at 300ms and 600ms bound the worst case at about a second of
      # backoff, against a gate that answers in 1.6s and a dedup stage that runs for 12 to 36.
      # Exhausting the attempts is not a failure, it just leaves the run ungated.
      #
      # A rejected request is not retried. An oversized batch (400 max_tokens_exceeded) and a bad
      # credential would fail identically every time, so JevClient raises JevTransientException
      # only for 429, 5xx and 529.
      jev-decisions:
        base-config: external-api
        wait-duration: 300ms
        retry-exceptions:
          - com.aisummarypodcast.llm.JevTransientException
          - org.springframework.web.client.ResourceAccessException

logging:
  file:
    name: app.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/app.%d{yyyy-MM-dd}.%i.log.gz
      max-history: 7

server:
  port: 8085
  shutdown: graceful