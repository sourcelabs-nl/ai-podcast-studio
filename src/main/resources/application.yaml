spring:
  application:
    name: ai-podcast-studio
  jackson:
    json:
      read:
        allow-backslash-escaping-any-character: true
  lifecycle:
    timeout-per-shutdown-phase: 10s
  # Baseline timeouts for auto-configured RestClient.Builder / RestTemplateBuilder clients
  # (Tavily, SoundCloud, X OAuth, research test). These are quick API calls — 30s read is a
  # generous backstop against an indefinite hang. Clients that build their own request factory
  # (LLM ChatClientFactory, Inworld TTS) are unaffected; ElevenLabs overrides read to 5m for
  # long audio synthesis.
  http:
    client:
      connect-timeout: 10s
      read-timeout: 30s
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration
  datasource:
    # SQLite permits only one writer at a time; WAL keeps reads non-blocking. busy_timeout makes a
    # connection that hits a write lock wait-and-retry (up to 30s) instead of failing with
    # SQLITE_BUSY. A single-connection pool is NOT used: the coroutine-based generation pipeline
    # needs several connections concurrently and would otherwise starve (HikariPool timeout).
    url: jdbc:sqlite:./data/ai-summary-podcast.db?busy_timeout=30000&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      connection-init-sql: "PRAGMA foreign_keys = ON"
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

app:
  encryption:
    master-key: ${APP_ENCRYPTION_MASTER_KEY}
  models:
    openrouter:
      "[openai/gpt-5.4-nano]":
        type: llm
        input-cost-per-mtok: 0.20
        output-cost-per-mtok: 1.25
      "[anthropic/claude-sonnet-4.6]":
        type: llm
        input-cost-per-mtok: 3.00
        output-cost-per-mtok: 15.00
      "[anthropic/claude-opus-4.7]":
        type: llm
        input-cost-per-mtok: 5.00
        output-cost-per-mtok: 25.00
      "[anthropic/claude-opus-4.8]":
        type: llm
        input-cost-per-mtok: 5.00
        output-cost-per-mtok: 25.00
      "[anthropic/claude-sonnet-5]":
        type: llm
        input-cost-per-mtok: 2.00
        output-cost-per-mtok: 10.00
      "[anthropic/claude-opus-5]":
        type: llm
        input-cost-per-mtok: 5.00
        output-cost-per-mtok: 25.00
      "[deepseek/deepseek-v4-flash]":
        type: llm
        input-cost-per-mtok: 0.0983
        output-cost-per-mtok: 0.1966
      # OpenRouter alias (note the leading "~") that always routes to the newest V4 Flash release,
      # currently deepseek-v4-flash-0731. Pricing is the alias's own listed price; the resolved
      # target can differ, so cost tracking for this entry is approximate by design.
      "[~deepseek/deepseek-v4-flash-latest]":
        type: llm
        input-cost-per-mtok: 0.08
        output-cost-per-mtok: 0.252
      # Pricing reflects the cheapest non-ZDR provider (DeepInfra) that Balanced routing selects;
      # the OpenRouter floor ($0.435/$0.87) is a ZDR provider we filter out.
      "[deepseek/deepseek-v4-pro]":
        type: llm
        input-cost-per-mtok: 1.30
        output-cost-per-mtok: 2.60
      # Pricing reflects DeepInfra, the cheapest provider OpenRouter routing selects for GLM-5.2.
      "[z-ai/glm-5.2]":
        type: llm
        input-cost-per-mtok: 1.00
        output-cost-per-mtok: 4.00
      # Z.ai is the only provider serving GLM-5.3, so its list price is the routed price.
      "[z-ai/glm-5.3]":
        type: llm
        input-cost-per-mtok: 1.40
        output-cost-per-mtok: 4.40
    openai:
      "[tts-1-hd]":
        type: tts
        cost-per-million-chars: 15.00
    elevenlabs:
      "[default]":
        type: tts
        cost-per-million-chars: 30.00
    inworld:
      "[inworld-tts-1.5-max]":
        type: tts
        cost-per-million-chars: 10.00
      "[inworld-tts-1.5-mini]":
        type: tts
        cost-per-million-chars: 5.00
      "[inworld-tts-2]":
        type: tts
        cost-per-million-chars: 25.00
  llm:
    defaults:
      filter:
        provider: openrouter
        model: openai/gpt-5.4-nano
      # Dedup clusters today's candidates against recent (title-only, capped) historical articles
      # and emits structured JSON. deepseek-v4-flash defaults to reasoning mode on OpenRouter, whose
      # hidden reasoning tokens count against the output cap and can burn the whole budget, returning
      # empty content — TopicDedupFilter explicitly disables reasoning (reasoningEffort("none")).
      dedup:
        provider: openrouter
        model: deepseek/deepseek-v4-flash
      compose:
        provider: openrouter
        model: z-ai/glm-5.2
    max-cost-cents: 200
    # Request timeout per stage. One blanket value cannot serve them all: scoring returns in seconds
    # and dedup has peaked at 3m06s, while compose over a large article set with tool calls has run
    # from 1m03s to 18m11s. A single compose-sized ceiling let one hung scoring call stall a whole
    # generation for 13 minutes; a scoring-sized one would fail a real compose run. Recap resolves
    # the filter model and so takes the filter timeout.
    timeouts:
      filter: 3m
      dedup: 5m
      compose: 20m
    scoring:
      concurrency: 10
    dedup:
      # Cap on historical articles (most recent first) embedded in the dedup prompt for topic recall.
      max-historical-articles: 120
  briefing:
    target-words: 1500
  episode:
    recap-lookback-episodes: 7
  research:
    cost-buffer-cents: 5
    tavily:
      cost-per-call-cents: 1
  compose:
    rapid-fire-budget-fraction: 0.15
    rapid-fire-max-items: 6
    # Cap on articles fed into a single compose request (highest-relevance kept, rest dropped).
    max-articles: 40
    # Ceiling on compose output tokens. Without one the provider reserves the model's whole output
    # window when checking affordability (a 402 asking for credit on 131,072 tokens to write a
    # 1,876-word script). Observed compose output: 2,540 min / 12,032 avg / 57,546 max, the model
    # being reasoning-heavy. Kept far above that max, since a tight ceiling truncates a script.
    max-output-tokens: 96000
  episodes:
    directory: ./data
    retention-days: 365
  # Audio generated from a script preview. It belongs to no episode, so it is kept outside the
  # episode store and swept once it is older than retention-minutes.
  preview-audio:
    directory: ./data/preview-audio
    retention-minutes: 120
    sweep-cron: "0 */15 * * * *"
  backup:
    enabled: true
    cron: "0 0 2 * * *"
    directory: ./data/backups
    retention-count: 7
  source:
    max-article-age-days: 90
    # If the last poll round is older than this (or none yet), generation runs a catch-up poll first.
    stale-round-threshold-minutes: 10
    # Host-level circuit breaker settings live under resilience4j.circuitbreaker below.
  feed:
    base-url: http://localhost:8085
    title: AI Summary Podcast
    description: AI-generated audio briefings from your favourite content sources
    owner-name: Sourcelabs
    owner-email: podcast@sourcelabs.nl
    author: Sourcelabs
    itunes-category: Technology
    explicit: false
  soundcloud:
    client-id: ${APP_SOUNDCLOUD_CLIENT_ID:}
    client-secret: ${APP_SOUNDCLOUD_CLIENT_SECRET:}

resilience4j:
  circuitbreaker:
    configs:
      # One breaker per source host, shared by all that host's sources. Because they share it, the
      # window fills inside a single poll round rather than over days. Only permanent failures
      # (403/404/410/401/DNS) count as failures; transient ones are ignored entirely, since
      # per-source exponential backoff already handles a merely-slow host.
      source-host:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 3
        minimum-number-of-calls: 3
        failure-rate-threshold: 100
        # A dead host is retried once a day, matching the per-source backoff ceiling.
        wait-duration-in-open-state: 24h
        # The single half-open call is the canary that probes for recovery.
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.aisummarypodcast.source.PollFailureException$Permanent
        # Ignored, not merely unrecorded: an unrecorded exception counts as a success and could
        # close the breaker on a host that never actually answered.
        ignore-exceptions:
          - com.aisummarypodcast.source.PollFailureException$Transient
        register-health-indicator: true
  retry:
    configs:
      # Retries around external LLM/TTS APIs: transient upstream faults and malformed responses.
      external-api:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        enable-exponential-backoff: true
    instances:
      article-scoring:
        base-config: external-api
      topic-dedup:
        base-config: external-api
      # Only genuinely transient Inworld faults are retried: a rate limit, an I/O failure
      # (connection reset, timeout) or an upstream 5xx. A rejected request fails immediately.
      inworld-tts:
        base-config: external-api
        retry-exceptions:
          - com.aisummarypodcast.tts.InworldRateLimitException
          - com.aisummarypodcast.tts.InworldTransientException
          - org.springframework.web.client.ResourceAccessException

logging:
  file:
    name: app.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/app.%d{yyyy-MM-dd}.%i.log.gz
      max-history: 7

server:
  port: 8085
  shutdown: graceful